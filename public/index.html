<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Prime Meridian</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Relative URLs resolve inside the kit's folder (it fetches ./assets/...);
       every game URL below and in the code is absolute (/js/, /assets/audio/). -->
  <base href="/kit/">
  <script type="importmap">{"imports": {"three": "/vendor/three-kit.mjs", "three/addons/": "/vendor/three-addons-r186/", "mujoco": "/vendor/mujoco/mujoco.js", "onnxruntime-web": "/vendor/onnxruntime/ort.wasm.min.mjs"}}</script>
  <!-- The world is the licensed Hiroshi's Island kit, loaded at runtime from
       /kit/ (public/kit/, gitignored; copy it from assets/private/kit/dist/).
       pm.kit adds the kit's stylesheet and loader. Without it, the scaffold runs. -->
  <style>
    html, body { margin: 0; height: 100%; background: #1b1f2a; overflow: hidden; }
    body.kit { background: #bdd6cb; }
    canvas { display: block; touch-action: none; }
    /* the kit's mount points */
    #cozy-scene { position: fixed; inset: 0; }
    #cozy-scene:empty { display: none; }
    #cozy-loading { display: none; }
    /* our own loading veil (the kit adds .done when its scene is ready) */
    body.kit #cozy-loading { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center;
      text-align: center; background: #20262f; color: #e8e4d8; font: 15px system-ui, sans-serif; transition: opacity .6s; }
    #cozy-loading h1 { margin: 0 0 10px; font: 600 30px system-ui, sans-serif; letter-spacing: .02em; }
    #cozy-loading.done { opacity: 0; pointer-events: none; visibility: hidden; transition: opacity .6s, visibility 0s .6s; }
    #cozy-audit { display: none; }
    /* the game's layer */
    /* Status ("admin") bubble: a small ⓘ next to 💭; click to open the status, which scrolls if long. */
    /* The three round-cornered buttons in the bottom-left row (💭 ⓘ 🎬): one size, one look,
       8px apart, 44px wide each: 14 | 66 | 118. The badge on 💭 floats over its corner so the
       button never grows and pushes into ⓘ. */
    #talk-toggle, #admin > summary, #views-label, #crew-roster .pm-btn.call, #crew-roster .pm-btn.mic {
      box-sizing: border-box; width: 44px; height: 40px; padding: 0; margin: 0; border: 1px solid rgba(255,255,255,.14);
      border-radius: 10px; background: rgba(20,24,32,.55); color: #f3efe2; font: 20px/1 system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none;
      backdrop-filter: blur(4px); transition: background .15s, border-color .15s; }
    #talk-toggle:hover, #admin > summary:hover, #views-label:hover { background: rgba(20,24,32,.8); border-color: rgba(255,255,255,.3); }
    /* the 📞/🎙 buttons: same 44×40 box, but a short label instead of one glyph */
    #crew-roster .pm-btn.call, #crew-roster .pm-btn.mic {
      font: 600 11px/1.1 system-ui, sans-serif; white-space: normal; text-align: center; overflow: hidden; flex: 0 0 auto; }
    #crew-roster .pm-btn.mic.listening { font-size: 9px; }
    #crew-roster .pm-btn.call.on { background: #e5484d; border-color: transparent; color: #fff; }
    #crew-roster .pm-btn.call:disabled, #crew-roster .pm-btn.mic:disabled { opacity: .4; cursor: default; }
    #admin { position: fixed; left: 66px; bottom: 170px; z-index: 200; font: 14px/1.4 system-ui, sans-serif; }
    #admin > summary { list-style: none; position: relative; z-index: 230; } /* above #hud (220): open, the HUD box covered the ⓘ and it couldn't be closed */
    #admin > summary::-webkit-details-marker { display: none; }
    #admin[open] > summary, #views-toggle:checked + #views-label { background: rgba(243,239,226,.92); color: #141820; border-color: transparent; }
    /* Scene menu (the kit's bottom bar of camera views): folded away until 🎬 opens it. */
    #views-label { position: fixed; left: 118px; bottom: 170px; z-index: 200; }
    body:not(:has(#views-toggle:checked)) .cozy-bottom-bar { display: none !important; }
    /* With the scene menu folded, our controls drop back to the bottom edge. */
    body:not(:has(#views-toggle:checked)) #brook { bottom: 14px; }
    body:not(:has(#views-toggle:checked)) #talk-toggle,
    body:not(:has(#views-toggle:checked)) #admin,
    body:not(:has(#views-toggle:checked)) #views-label { bottom: 56px; }
    body:not(:has(#views-toggle:checked)) #talk-panel,
    body:not(:has(#views-toggle:checked)) #hud { bottom: 108px; }
    body:not(:has(#views-toggle:checked)) #caption { bottom: 110px; }
    #hud { position: fixed; left: 14px; bottom: 222px; width: min(520px, calc(100vw - 28px)); max-height: 40vh; overflow-y: auto; z-index: 220;
           background: rgba(20,24,32,.88); color: #f3efe2; border-radius: 10px; padding: 10px 14px; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
    #brain-ui { position: fixed; left: 14px; bottom: 198px; z-index: 220; color: #f3efe2;
                font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
                background: rgba(20,24,32,.88); border-radius: 8px; padding: 4px 10px;
                display: flex; gap: 8px; align-items: center; }
    #brain-ui[hidden] { display: none; }
    #brain-ui select, #brain-ui button { font: inherit; }
    /* our controls sit above the kit's camera row along the bottom (it spans the full width) */
    #brook { position: fixed; bottom: 128px; left: 14px; z-index: 200; color: #e8e4d8; font: 13px system-ui, sans-serif;
      background: rgba(0,0,0,.35); padding: 8px 10px; border-radius: 8px; display: flex; gap: 12px; align-items: center; }
    #brook input[type=range] { width: 110px; }
    #brook button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid #777; background: #2b3040; color: #e8e4d8; cursor: pointer; }
    #caption { position: fixed; left: 50%; bottom: 140px; transform: translateX(-50%); max-width: min(760px, calc(100vw - 32px)); z-index: 210; padding: 12px 20px; border-radius: 12px; background: rgba(20,24,32,.80); color: #f3efe2; font: 22px/1.35 system-ui, sans-serif; text-align: center; opacity: 0; transition: opacity .5s; pointer-events: none; }
    #caption.show { opacity: 1; }
    #talk-toggle { position: fixed; left: 14px; bottom: 170px; z-index: 200; }
    #talk-badge { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box;
                  border-radius: 9px; background: rgba(243,239,226,.92); color: #141820; font: 700 11px/18px system-ui; text-align: center; }
    #talk-badge:empty { display: none; }
    /* The 💭 panel is split: the history scrolls in the top part; the say… boxes (the
       crew roster) and the hold switch stay pinned at the bottom, like a chat composer,
       so nobody scrolls back over the history to talk to someone (Michael). */
    #talk-panel { position: fixed; left: 14px; bottom: 222px; top: 72px; width: min(380px, calc(100vw - 28px)); overflow: hidden; z-index: 220; background: rgba(20,24,32,.88); color: #f3efe2; border-radius: 10px; font: 16px/1.4 system-ui, sans-serif;
                  display: flex; flex-direction: column; }   /* top to the buttons: the history gets the room */
    #talk-list { list-style: none; margin: 0; padding: 8px 12px; order: 1; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
    #crew-roster { order: 2; flex: 0 0 auto; }
    #hold-row { order: 3; flex: 0 0 auto; }
    #talk-list li { padding: 4px 0; cursor: pointer; }
    .time { opacity: .6; margin-right: 6px; }
    .who { font-weight: 600; margin-right: 6px; }
    #talk-panel[hidden] { display: none; }
    #talk-list li.chore label { cursor: pointer; }
    #talk-list li.chore input { margin: 0 6px 0 0; vertical-align: middle; }
    #talk-list li.chore.undone .text { text-decoration: line-through; opacity: .6; }
    #talk-list li.request .text { font-weight: 500; }
    #talk-toggle.alert #talk-badge { background: #e5484d; color: #fff; }
    #crew-roster { list-style: none; margin: 0; padding: 8px 12px 4px; display: flex; flex-direction: column; gap: 4px;
      border-top: 1px solid rgba(255,255,255,.15); max-height: 34%; overflow-y: auto; }
    #crew-roster .row { display: flex; align-items: center; gap: 6px; font-size: 14px; }
    #crew-roster input[type=text] { flex: 1; min-width: 0; font: inherit; background: rgba(255,255,255,.08); color: inherit;
      border: 1px solid rgba(255,255,255,.2); border-radius: 6px; padding: 2px 6px; }
    /* The phone (GDD §2.1): contacts list when no thread is open (it takes the whole panel),
       a thread with a header and the composer when one is. */
    #talk-panel:has(#talk-list[hidden]) #crew-roster { max-height: none; flex: 1 1 auto; border-top: 0; }
    #crew-roster .contact { padding: 8px 6px; border-radius: 8px; cursor: pointer; gap: 10px; font-size: 15px; }
    #crew-roster .contact:hover { background: rgba(255,255,255,.08); }
    #crew-roster .contact .avatar { position: relative; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.14); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
    #crew-roster .contact .avatar .all { font-size: 18px; opacity: .8; }
    #crew-roster .contact .avatar .badge { position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #141820; font: 700 9px/12px system-ui; text-align: center; color: #fff; font-style: normal; box-sizing: content-box; }
    #crew-roster .contact .avatar.hollow .badge { background: transparent !important; border-color: #9aa0a6; }
    #crew-roster .contact .avatar.asking .badge { width: 14px; height: 14px; line-height: 14px; }
    #crew-roster .contact .who { flex: 0 0 auto; }
    #crew-roster .contact .preview { flex: 1 1 auto; min-width: 0; opacity: .55; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #crew-roster .contact .arrow { opacity: .4; }
    #crew-roster .contact .unread { min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: #3b82f6; color: #fff; font: 700 12px/20px system-ui; text-align: center; flex: 0 0 auto; }
    #crew-roster .thread-head { display: flex; align-items: center; gap: 8px; padding: 6px 4px 4px; font-size: 15px; }
    #crew-roster .thread-head .back { font: 14px system-ui, sans-serif; padding: 4px 10px; border-radius: 999px; border: 0; background: rgba(255,255,255,.12); color: inherit; cursor: pointer; }
    #crew-roster .thread-head .back:hover { background: rgba(255,255,255,.22); }
    #crew-roster .composer { padding: 6px 2px 4px; gap: 8px; }
    #crew-roster .composer input { border-radius: 999px; padding: 8px 14px; font-size: 15px; box-sizing: border-box; height: 40px; } /* = the 🎙's 40px: a call adding the 🎙 must not grow the row and lift the 📞/End above it (fixed controls never move) */
    /* bubbles: theirs left, yours right */
    #talk-list { display: flex; flex-direction: column; gap: 6px; }
    #talk-list[hidden] { display: none; }
    #talk-list li { max-width: 86%; padding: 7px 12px; border-radius: 16px; background: rgba(255,255,255,.10); align-self: flex-start; border-bottom-left-radius: 5px; }
    #talk-list li.mine { align-self: flex-end; background: rgba(76,160,96,.55); border-bottom-left-radius: 16px; border-bottom-right-radius: 5px; }
    #talk-list li .time { display: block; font-size: 11px; margin: 0 0 2px; }
    #talk-list li.crew { cursor: default; }
    #talk-list li.crew .row { display: flex; align-items: center; gap: 6px; }
    #talk-list li.crew .text { flex: 1; }
    #talk-list li.crew .risky { color: #e5484d; }
    #talk-list li.crew .hint { opacity: .6; font-size: 12px; margin-left: 6px; }
    #talk-list li.crew button.deny { font: inherit; border: 1px solid #777; background: #2b3040; color: #e8e4d8;
      border-radius: 6px; padding: 0 6px; cursor: pointer; }
    #talk-list li.crew input[type=text] { font: inherit; background: rgba(255,255,255,.08); color: inherit;
      border: 1px solid rgba(255,255,255,.2); border-radius: 6px; padding: 1px 6px; width: 7em; }
    #talk-list li.crew button:disabled,
    #talk-list li.crew input:disabled { opacity: .4; cursor: default; }
    #talk-list li.crew.quiet { opacity: .7; font-size: 14px; }
    #talk-list li.crew.quiet .row { gap: 0; }
    #talk-list li.gone { opacity: .35; transition: opacity 1s; }
    #hold-row { display: flex; align-items: center; gap: 6px; padding: 4px 12px 8px; font-size: 12px; opacity: .8; }
    #hold-row[hidden] { display: none; }
    #hold-row .hint { opacity: .6; font-size: 12px; }
    #crew-roster .roster-log { padding: 0 0 4px 22px; opacity: .75; font-size: 12px; display: flex;
      flex-direction: column; gap: 2px; }
  </style>
</head>
<body>
  <main id="cozy-scene" aria-label="Prime Meridian estate"></main>
  <div id="cozy-loading"><h1>Prime Meridian</h1><p id="cozy-load-status">Loading the estate…</p></div>
  <pre id="cozy-audit" aria-hidden="true"></pre>
  <input type="checkbox" id="views-toggle" hidden><label id="views-label" for="views-toggle" title="Scene views">🎬</label>
  <details id="admin"><summary title="Status">ⓘ</summary><div id="hud"><span id="hud-text">Prime Meridian</span>
    <p id="credits" style="font-size:11px;opacity:.75;margin:6px 0 0">Music made with Suno by DJ Mik'AĪ'ele. Construct theme: "(Nu)Clear Vision", a remix of a song by cyberpirate420 on Suno (class demo only).</p></div>
    <!-- everything but the summary is position: fixed, so the ⓘ never moves when it opens -->
    <div id="brain-ui" hidden><label>age <select id="brain-age"></select></label> <button id="brain-drop">drop again</button></div>
  </details>
  <div id="brook">
    <button id="brook-toggle">▶ brook</button>
    <button id="voice-toggle">🔇 voice off</button>
    <button id="music-toggle">♪ music</button>
    <select id="brook-source"><option value="synth">synth</option><option value="file">file</option><option value="both">both</option></select>
    <label>flow <input id="brook-flow" type="range" min="0" max="1" step="0.01" value="0.6"></label>
    <label id="brook-depth-label">depth <input id="brook-depth" type="range" min="0" max="1" step="0.01" value="0.4"></label>
  </div>
  <div id="caption" aria-live="polite"><b id="caption-who"></b><span id="caption-text"></span></div>
  <button id="talk-toggle" title="What was said">💭<span id="talk-badge"></span></button>
  <div id="talk-panel" hidden>
    <label id="hold-row"><input type="checkbox" id="hold-toggle"> I'll answer <span id="hold-hint" class="hint"></span></label>
    <div id="crew-roster"></div><ol id="talk-list"></ol>
  </div>
  <script src="/js/main.js"></script>
</body>
</html>
