<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Prime Meridian</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Relative URLs resolve inside the kit's folder (it fetches ./assets/...);
       every game URL below and in the code is absolute (/js/, /assets/audio/). -->
  <base href="/kit/">
  <script type="importmap">{"imports": {"three": "/vendor/three-kit.mjs", "three/addons/": "/vendor/three-addons-r186/", "mujoco": "/vendor/mujoco/mujoco.js", "onnxruntime-web": "/vendor/onnxruntime/ort.wasm.min.mjs"}}</script>
  <!-- The world is the licensed Hiroshi's Island kit, loaded at runtime from
       /kit/ (public/kit/, gitignored; copy it from assets/private/kit/dist/).
       pm.kit adds the kit's stylesheet and loader. Without it, the scaffold runs. -->
  <style>
    html, body { margin: 0; height: 100%; background: #1b1f2a; overflow: hidden; }
    body.kit { background: #bdd6cb; }
    canvas { display: block; touch-action: none; }
    /* the kit's mount points */
    #cozy-scene { position: fixed; inset: 0; }
    #cozy-scene:empty { display: none; }
    #cozy-loading { display: none; }
    /* our own loading veil (the kit adds .done when its scene is ready) */
    body.kit #cozy-loading { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center;
      text-align: center; background: #20262f; color: #e8e4d8; font: 15px system-ui, sans-serif; transition: opacity .6s; }
    #cozy-loading h1 { margin: 0 0 10px; font: 600 30px system-ui, sans-serif; letter-spacing: .02em; }
    #cozy-loading.done { opacity: 0; pointer-events: none; visibility: hidden; transition: opacity .6s, visibility 0s .6s; }
    #cozy-audit { display: none; }
    /* the game's layer */
    /* Status ("admin") bubble: a small ⓘ next to 💭; click to open the status, which scrolls if long. */
    #admin { position: fixed; left: 64px; bottom: 170px; z-index: 200; font: 14px/1.4 system-ui, sans-serif; }
    #admin > summary { list-style: none; cursor: pointer; font: 20px system-ui; background: rgba(0,0,0,.35); color: #f3efe2; border-radius: 8px; padding: 4px 10px; user-select: none; }
    #admin > summary::-webkit-details-marker { display: none; }
    #admin[open] > summary { background: rgba(20,24,32,.88); }
    /* Scene menu (the kit's bottom bar of camera views): folded away until 🎬 opens it. */
    #views-label { position: fixed; left: 114px; bottom: 170px; z-index: 200; cursor: pointer; font: 20px system-ui; background: rgba(0,0,0,.35); color: #f3efe2; border-radius: 8px; padding: 4px 10px; user-select: none; }
    #views-toggle:checked + #views-label { background: rgba(20,24,32,.88); }
    body:not(:has(#views-toggle:checked)) .cozy-bottom-bar { display: none !important; }
    /* With the scene menu folded, our controls drop back to the bottom edge. */
    body:not(:has(#views-toggle:checked)) #brook { bottom: 14px; }
    body:not(:has(#views-toggle:checked)) #talk-toggle,
    body:not(:has(#views-toggle:checked)) #admin,
    body:not(:has(#views-toggle:checked)) #views-label { bottom: 56px; }
    body:not(:has(#views-toggle:checked)) #talk-panel,
    body:not(:has(#views-toggle:checked)) #hud { bottom: 108px; }
    body:not(:has(#views-toggle:checked)) #caption { bottom: 110px; }
    #hud { position: fixed; left: 14px; bottom: 222px; width: min(520px, calc(100vw - 28px)); max-height: 40vh; overflow-y: auto; z-index: 220;
           background: rgba(20,24,32,.88); color: #f3efe2; border-radius: 10px; padding: 10px 14px; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
    #brain-ui { position: fixed; left: 14px; bottom: 198px; z-index: 220; color: #f3efe2;
                font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
                background: rgba(20,24,32,.88); border-radius: 8px; padding: 4px 10px;
                display: flex; gap: 8px; align-items: center; }
    #brain-ui[hidden] { display: none; }
    #brain-ui select, #brain-ui button { font: inherit; }
    /* our controls sit above the kit's camera row along the bottom (it spans the full width) */
    #brook { position: fixed; bottom: 128px; left: 14px; z-index: 200; color: #e8e4d8; font: 13px system-ui, sans-serif;
      background: rgba(0,0,0,.35); padding: 8px 10px; border-radius: 8px; display: flex; gap: 12px; align-items: center; }
    #brook input[type=range] { width: 110px; }
    #brook button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid #777; background: #2b3040; color: #e8e4d8; cursor: pointer; }
    #caption { position: fixed; left: 50%; bottom: 140px; transform: translateX(-50%); max-width: min(760px, calc(100vw - 32px)); z-index: 210; padding: 12px 20px; border-radius: 12px; background: rgba(20,24,32,.80); color: #f3efe2; font: 22px/1.35 system-ui, sans-serif; text-align: center; opacity: 0; transition: opacity .5s; pointer-events: none; }
    #caption.show { opacity: 1; }
    #talk-toggle { position: fixed; left: 14px; bottom: 170px; z-index: 200; font: 22px system-ui; background: rgba(0,0,0,.35); border: 0; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
    #talk-badge { font: 600 12px system-ui; color: #f3efe2; margin-left: 4px; }
    #talk-panel { position: fixed; left: 14px; bottom: 222px; width: min(380px, calc(100vw - 28px)); max-height: 50vh; overflow-y: auto; z-index: 220; background: rgba(20,24,32,.88); color: #f3efe2; border-radius: 10px; font: 16px/1.4 system-ui, sans-serif; }
    #talk-list { list-style: none; margin: 0; padding: 8px 12px; }
    #talk-list li { padding: 4px 0; cursor: pointer; }
    .time { opacity: .6; margin-right: 6px; }
    .who { font-weight: 600; margin-right: 6px; }
    #talk-panel[hidden] { display: none; }
    #talk-list li.chore label { cursor: pointer; }
    #talk-list li.chore input { margin: 0 6px 0 0; vertical-align: middle; }
    #talk-list li.chore.undone .text { text-decoration: line-through; opacity: .6; }
    #talk-list li.request .text { font-weight: 500; }
    #talk-toggle.alert #talk-badge { background: #e5484d; color: #fff; border-radius: 9px; padding: 0 5px; }
    #crew-roster { list-style: none; margin: 0; padding: 8px 12px 0; display: flex; flex-direction: column; gap: 4px;
      border-bottom: 1px solid rgba(255,255,255,.15); }
    #crew-roster .row { display: flex; align-items: center; gap: 6px; font-size: 14px; }
    #crew-roster input[type=text] { flex: 1; min-width: 0; font: inherit; background: rgba(255,255,255,.08); color: inherit;
      border: 1px solid rgba(255,255,255,.2); border-radius: 6px; padding: 2px 6px; }
    #talk-list li.crew { cursor: default; }
    #talk-list li.crew .row { display: flex; align-items: center; gap: 6px; }
    #talk-list li.crew .text { flex: 1; }
    #talk-list li.crew .risky { color: #e5484d; }
    #talk-list li.crew .hint { opacity: .6; font-size: 12px; margin-left: 6px; }
    #talk-list li.crew button.deny { font: inherit; border: 1px solid #777; background: #2b3040; color: #e8e4d8;
      border-radius: 6px; padding: 0 6px; cursor: pointer; }
    #talk-list li.crew input[type=text] { font: inherit; background: rgba(255,255,255,.08); color: inherit;
      border: 1px solid rgba(255,255,255,.2); border-radius: 6px; padding: 1px 6px; width: 7em; }
    #talk-list li.crew button:disabled,
    #talk-list li.crew input:disabled { opacity: .4; cursor: default; }
    #talk-list li.crew.quiet { opacity: .7; font-size: 14px; }
    #talk-list li.crew.quiet .row { gap: 0; }
    #talk-list li.gone { opacity: .35; transition: opacity 1s; }
    #hold-row { display: flex; align-items: center; gap: 6px; padding: 8px 12px 4px; font-size: 14px; }
    #hold-row .hint { opacity: .6; font-size: 12px; }
    #crew-roster .roster-log { padding: 0 0 4px 22px; opacity: .75; font-size: 12px; display: flex;
      flex-direction: column; gap: 2px; }
  </style>
</head>
<body>
  <main id="cozy-scene" aria-label="Prime Meridian estate"></main>
  <div id="cozy-loading"><h1>Prime Meridian</h1><p id="cozy-load-status">Loading the estate…</p></div>
  <pre id="cozy-audit" aria-hidden="true"></pre>
  <input type="checkbox" id="views-toggle" hidden><label id="views-label" for="views-toggle" title="Scene views">🎬</label>
  <details id="admin"><summary title="Status">ⓘ</summary><div id="hud">Prime Meridian</div>
    <div id="brain-ui" hidden><label>age <select id="brain-age"></select></label> <button id="brain-drop">drop again</button></div>
  </details>
  <div id="brook">
    <button id="brook-toggle">▶ brook</button>
    <button id="voice-toggle">🔇 voice off</button>
    <select id="brook-source"><option value="synth">synth</option><option value="file">file</option><option value="both">both</option></select>
    <label>flow <input id="brook-flow" type="range" min="0" max="1" step="0.01" value="0.6"></label>
    <label id="brook-depth-label">depth <input id="brook-depth" type="range" min="0" max="1" step="0.01" value="0.4"></label>
  </div>
  <div id="caption" aria-live="polite"><b id="caption-who"></b><span id="caption-text"></span></div>
  <button id="talk-toggle" title="What was said">💭<span id="talk-badge"></span></button>
  <div id="talk-panel" hidden>
    <label id="hold-row"><input type="checkbox" id="hold-toggle"> I'll answer <span id="hold-hint" class="hint"></span></label>
    <div id="crew-roster"></div><ol id="talk-list"></ol>
  </div>
  <script src="/js/main.js"></script>
</body>
</html>
