<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Prime Meridian</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Relative URLs resolve inside the kit's folder (it fetches ./assets/...);
       every game URL below and in the code is absolute (/js/, /assets/audio/). -->
  <base href="/kit/">
  <!-- The world is the licensed Hiroshi's Island kit, loaded at runtime from
       /kit/ (public/kit/, gitignored; copy it from assets/private/kit/dist/).
       pm.kit adds the kit's stylesheet and loader. Without it, the scaffold runs. -->
  <style>
    html, body { margin: 0; height: 100%; background: #1b1f2a; overflow: hidden; }
    body.kit { background: #bdd6cb; }
    canvas { display: block; touch-action: none; }
    /* the kit's mount points */
    #cozy-scene { position: fixed; inset: 0; }
    #cozy-scene:empty { display: none; }
    #cozy-loading { display: none; }
    /* our own loading veil (the kit adds .done when its scene is ready) */
    body.kit #cozy-loading { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center;
      text-align: center; background: #20262f; color: #e8e4d8; font: 15px system-ui, sans-serif; transition: opacity .6s; }
    #cozy-loading h1 { margin: 0 0 10px; font: 600 30px system-ui, sans-serif; letter-spacing: .02em; }
    #cozy-loading.done { opacity: 0; pointer-events: none; visibility: hidden; transition: opacity .6s, visibility 0s .6s; }
    #cozy-audit { display: none; }
    /* the game's layer */
    #hud { position: fixed; top: 12px; left: 14px; z-index: 200; color: #e8e4d8; font: 14px/1.4 system-ui, sans-serif;
      opacity: .9; pointer-events: none; }
    body.kit #hud { color: #24312a; background: rgba(238,241,223,.72); padding: 4px 10px; border-radius: 8px; }
    /* our controls sit above the kit's camera row along the bottom (it spans the full width) */
    #brook { position: fixed; bottom: 128px; left: 14px; z-index: 200; color: #e8e4d8; font: 13px system-ui, sans-serif;
      background: rgba(0,0,0,.35); padding: 8px 10px; border-radius: 8px; display: flex; gap: 12px; align-items: center; }
    #brook input[type=range] { width: 110px; }
    #brook button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid #777; background: #2b3040; color: #e8e4d8; cursor: pointer; }
    #caption { position: fixed; left: 50%; bottom: 140px; transform: translateX(-50%); max-width: min(760px, calc(100vw - 32px)); z-index: 210; padding: 12px 20px; border-radius: 12px; background: rgba(20,24,32,.80); color: #f3efe2; font: 22px/1.35 system-ui, sans-serif; text-align: center; opacity: 0; transition: opacity .5s; pointer-events: none; }
    #caption.show { opacity: 1; }
    #talk-toggle { position: fixed; left: 14px; bottom: 170px; z-index: 200; font: 22px system-ui; background: rgba(0,0,0,.35); border: 0; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
    #talk-badge { font: 600 12px system-ui; color: #f3efe2; margin-left: 4px; }
    #talk-panel { position: fixed; left: 14px; bottom: 222px; width: min(380px, calc(100vw - 28px)); max-height: 50vh; overflow-y: auto; z-index: 220; background: rgba(20,24,32,.88); color: #f3efe2; border-radius: 10px; font: 16px/1.4 system-ui, sans-serif; }
    #talk-list { list-style: none; margin: 0; padding: 8px 12px; }
    #talk-list li { padding: 4px 0; cursor: pointer; }
    .time { opacity: .6; margin-right: 6px; }
    .who { font-weight: 600; margin-right: 6px; }
    #talk-panel[hidden] { display: none; }
    #talk-list li.chore label { cursor: pointer; }
    #talk-list li.chore input { margin: 0 6px 0 0; vertical-align: middle; }
    #talk-list li.chore.undone .text { text-decoration: line-through; opacity: .6; }
    #talk-list li.request .text { font-weight: 500; }
  </style>
</head>
<body>
  <main id="cozy-scene" aria-label="Prime Meridian estate"></main>
  <div id="cozy-loading"><h1>Prime Meridian</h1><p id="cozy-load-status">Loading the estate…</p></div>
  <pre id="cozy-audit" aria-hidden="true"></pre>
  <div id="hud">Prime Meridian</div>
  <div id="brook">
    <button id="brook-toggle">▶ brook</button>
    <button id="voice-toggle">🔇 voice off</button>
    <select id="brook-source"><option value="synth">synth</option><option value="file">file</option><option value="both">both</option></select>
    <label>flow <input id="brook-flow" type="range" min="0" max="1" step="0.01" value="0.6"></label>
    <label id="brook-depth-label">depth <input id="brook-depth" type="range" min="0" max="1" step="0.01" value="0.4"></label>
  </div>
  <div id="caption" aria-live="polite"><b id="caption-who"></b><span id="caption-text"></span></div>
  <button id="talk-toggle" title="What was said">💭<span id="talk-badge"></span></button>
  <div id="talk-panel" hidden><ol id="talk-list"></ol></div>
  <script src="/js/main.js"></script>
</body>
</html>
